<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/bootstrap.css">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,900&family=Special+Elite&display=swap" rel="stylesheet">
    <title> Vittoria </title>
</head>
<body class="userform"> <!-- sfondo sfocato -->
    <div id="debriefing-container" class="dossier-box text-center p-5 shadow-lg fade-in">
        <img id="avatar-vittoria" src="" class="avatar-img mb-4" alt="Avatar Giocatore">
        <p id="testoVittoria" class="special-elite text-light fs-4 text-start"></p>
        <button id="btnClassifica" class="btn btn-outline-light btn-lg mt-4 d-none fade-in" onclick="mostraClassifica()">
            Visualizza classifica globale
        </button>
    </div>
    <!-- Classifica -->
    <div id="leaderboard-container" class="dossier-box text-center p-5 shadow-lg d-none fade-in-slow">
        <h2 class="special-elite mb-2" style="color:#8b07ff">CLASSIFICA AGENTI</h2>
        <p class="playfair fs-4 mb-4">Il tuo punteggio: <span id="punteggio-giocatore" class="fw-bold" style="color: #8c9eff"></span></p>
        <div class="table-responsive">
            <table class="table table-classifica mt-3">
                <thead>
                    <tr>
                        <th scope="col">Posizione</th>
                        <th scope="col">Nome Agente</th>
                        <th scope="col">Punteggio</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                </tbody>
            </table>
        </div>
        <div class="mt-4">
            <button class="btn btn-outline-light btn-lg mt-3" onclick="eseguiLogout()">Esci</button>
        </div>
    </div>
    <!-- Pulsante musica -->
    <audio id="bgMusic" loop>
        <source src="../assets/audio/victory.mp3" type="audio/mpeg">
    </audio>
    <button type="button" class="btn-music-gameT" data-bs-toggle="modal" data-bs-target="#volumeModal">
        <span style="color: #f8fafb;">♫</span>
    </button>
</body>
<script src="../js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
