<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,900&family=Special+Elite&display=swap" rel="stylesheet">
    <title> Stanza 1 </title>
</head>
<body>
  <!-- Messaggio rotazione per schermi piccoli -->
  <div id="rotate-message">
        <h2 class="special-elite fs-1"> Attenzione Agente! </h2>
        <p class="playfair mt-3 fs-1">Questo gioco richiede una visione panoramica.</p>
        <p class="special-elite" style="color: #8c9eff; font-size: 2.3rem;">Ruota il tuo dispositivo in orizzontale.</p>
    </div>
    <!-- Avatar in alto con taccuino e icona notifica -->
    <div id="room1" class="turing fade-in-slow blocco-interazione">
      <div id="avatarcontenitore" class="avatar-imm d-none">
        <img id="avatarid" src="" alt="Avatar Giocatore" onclick="apriTaccuino()" style="cursor: pointer;">
        <span id="badgeNotifica" class="badge-notifica" style="--badge-color: #0e291ff1;">!</span>
      </div>
      <!-- Box introduzione con pulsante esplora-->
      <div id="introT" class="dossier-box text-center p-5 shadow-lg centraT">
        <p id="testoMacchina1" class="special-elite text-light fs-5 text-start"></p>
        <button id="btnEntra" class="btn btn-outline-light btn-lg mt-4 d-none" onclick="iniziaEsplorazioneT()">
          Esplora
        </button>
      </div>
      <!-- Oggetti cliccabili-->
      <div class="oggetto-cliccabile macchina-da-scrivere" id="macchinaT" onclick="mostraEnigmaFinale()"></div>
      <div class="oggetto-cliccabile mappa-mondo" onclick="mostraAtmosferaTuring()"></div>
      <div class="oggetto-cliccabile serranda" onclick="mostraIndizioTuring()"></div>
      <div class="oggetto-cliccabile scatoloni" onclick="mostraScatoloni()"></div>
      <div class="oggetto-cliccabile cappello" onclick="mostraCappello()"></div>
      <div class="oggetto-cliccabile lavagna" id="lavagnaT" onclick="mostraLavagna()"></div>
      <div class="oggetto-cliccabile telefono" id="telefonoT" onclick="mostraTelefono()"></div>
    </div>
    <!-- Modal enigmi -->
    <div class="modal fade" id="enigmaModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-enigma bg-dark text-light border-light">
          <div class="modal-header border-light">
            <h5 class="modal-title special-elite" id="modalTitle"></h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="playfair" id="descrizione"></p>
            <p class="warning" id="richiesta"></p>
            <input type="text" id="codiceSoluzione" class="form-control form-control-lg text-center special-elite" autocomplete="boh" placeholder="?????">
          </div>
          <div class="modal-footer border-light">
            <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Annulla</button>
            <button type="button" class="btn btn-light text-dark" id="btnConferma"></button>
          </div>
        </div>
      </div>
    </div>
    <!-- Modal indizi -->
    <div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-enigma border-light text-light">
          <div class="modal-header border-light">
            <h5 class="modal-title special-elite" id="infoTitolo">Indizio</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <p class="playfair" id="infoTesto" style="color: #e3e0e2; font-size: 1.3rem;">...</p>
          </div>
          <div class="modal-footer border-light justify-content-center">
            <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Chiudi</button>
          </div>
        </div>
      </div>
    </div>
  <!-- Pulsante e modal impostazioni -->
    <audio id="bgMusic" loop>
        <source src="/assets/audio/room1.mp3" type="audio/mpeg">
    </audio>
    <button type="button" class="btn-music-gameT" data-bs-toggle="modal" data-bs-target="#settingsModal">
        <i class="bi bi-gear-fill" style="color: #f8fafb; font-size: 1.5rem;"></i>
    </button>
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content modal-enigma bg-dark text-light border-light">
            <div class="modal-header border-light">
                <h5 class="modal-title special-elite" id="settingsModalLabel">Impostazioni</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <!-- Regola volume -->
            <div class="modal-body text-center playfair">
                <label for="volumeSlider" class="form-label mb-2 fs-5">Regola audio</label>
                <div class="d-flex align-items-center justify-content-center gap-3">
                    <i class="bi bi-volume-up" style="font-size: 1.8rem; color: #F8F8FF;"></i>
                    <input type="range" class="form-range" id="volumeSlider" min="0" max="1" step="0.01" value="0.3" style="width: 70%;">
                </div>
                <!-- Cronometro visibile -->
                <hr class="border-light my-3">
                <div class="text-center mb-3">
                  <h5>Tempo stanza</h5>
                  <p id="timerVisibile" class="fs-3 text-white mb-0">00:00</p>
                </div>
                <!-- Logout -->
                <hr class="border-light my-4">
                <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal" onclick="eseguiLogout()"> Esci </button>
        </div>
    </div>
</div>
</body>
<script src="/js/api.js"></script>
<script src="/js/room1.js"></script>
<script src="/js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
